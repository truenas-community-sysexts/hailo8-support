name: Check for New Releases

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Serialize manual dispatches against the scheduled run so two concurrent
# invocations cannot race on the commit/push of tracked-versions.json.
concurrency:
  group: check-releases
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      # Mint a short-lived token from sysext-ci-automation-app (in the
      # default-branch ruleset bypass list) to push tracked-versions.json back
      # to main; the default GITHUB_TOKEN's github-actions[bot] is not exempt.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      # ─────────────────────────────────────────────────────────────────────
      # Read current tracked state.
      # ─────────────────────────────────────────────────────────────────────
      - name: Read tracked versions
        id: tracked
        run: |
          set -o pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open('.github/tracked-versions.json') as f:
              s = json.load(f)
          print(f"truenas_version={s['truenas']['version']}")
          print(f"train={s['truenas']['train']}")
          print(f"preview_version={s['truenas_preview']['version']}")
          print(f"preview_train={s['truenas_preview']['train']}")
          print(f"preview_runner={s['truenas_preview']['runner']}")
          print(f"preview_channel_url={s['truenas_preview']['channel_url']}")
          print(f"hailo_driver={s['hailo']['driver']}")
          PY

      # ─────────────────────────────────────────────────────────────────────
      # TrueNAS check: pick the latest stable scale-build tag, resolve its
      # train from the download.truenas.com listing, and gate on the matching
      # ISO actually being published. Tags can land hours or days before the
      # ISO; defer the bump rather than fail mid-build.
      # ─────────────────────────────────────────────────────────────────────
      - name: Check for new TrueNAS release
        id: truenas
        env:
          CURRENT_VERSION: ${{ steps.tracked.outputs.truenas_version }}
          CURRENT_TRAIN: ${{ steps.tracked.outputs.train }}
          # Public scale-build tag listing — default GITHUB_TOKEN's 5000/hr
          # quota is plenty for these read-only API calls; the app token is
          # used only for the push to main and the build dispatch.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          echo "Currently tracked: ${CURRENT_VERSION} on train ${CURRENT_TRAIN}"

          if ! TAGS_JSON=$(curl -fsSL "https://api.github.com/repos/truenas/scale-build/tags?per_page=100" \
              -H "Authorization: Bearer ${GH_TOKEN}"); then
            echo "::error title=TrueNAS check::failed to fetch scale-build tags"
            exit 1
          fi

          # Stable tags are TS- followed by a purely-numeric dotted version
          # (e.g. TS-25.10.3, TS-25.10.3.1). Any non-numeric suffix
          # (BETA, RC, ALPHA, MASTER, ...) is a pre-release and excluded.
          LATEST_TAG=$(printf '%s' "$TAGS_JSON" | python3 -c "
          import sys, json, re
          tags = json.load(sys.stdin)
          stable_re = re.compile(r'^TS-(\d+(?:\.\d+)+)$')
          stable = [(m.group(1), t['name']) for t in tags
                    if (m := stable_re.match(t['name']))]
          if not stable:
              sys.exit(0)
          stable.sort(key=lambda v: [int(p) for p in v[0].split('.')])
          print(stable[-1][1])
          ")

          if [ -z "$LATEST_TAG" ]; then
            echo "::error title=TrueNAS check::no stable tags found in scale-build (parser likely broken)"
            exit 1
          fi

          LATEST_VERSION="${LATEST_TAG#TS-}"
          echo "Latest scale-build tag: ${LATEST_TAG} (version: ${LATEST_VERSION})"

          if [ "$LATEST_VERSION" = "$CURRENT_VERSION" ]; then
            echo "No new TrueNAS release"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Defense against tag deletions / numeric regressions.
          HIGHER=$(printf '%s\n%s\n' "$CURRENT_VERSION" "$LATEST_VERSION" | python3 -c "
          import sys
          versions = [line.strip() for line in sys.stdin if line.strip()]
          versions.sort(key=lambda v: [int(p) for p in v.split('.')])
          print(versions[-1])
          ")
          if [ "$HIGHER" != "$LATEST_VERSION" ]; then
            echo "Latest tag ${LATEST_VERSION} is not higher than tracked ${CURRENT_VERSION} — ignoring"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Resolve train name from the download.truenas.com listing.
          if ! LISTING=$(curl -fsSL "https://download.truenas.com/"); then
            echo "::error title=TrueNAS check::failed to fetch download.truenas.com listing"
            exit 1
          fi

          TRAIN_COUNT=$(printf '%s' "$LISTING" | python3 -c "
          import sys, re
          trains = sorted(set(re.findall(r'TrueNAS-SCALE-([A-Z][a-zA-Z]+)/', sys.stdin.read())))
          print(len(trains))
          ")
          # download.truenas.com historically lists 3+ trains (Angelfish, Cobia,
          # Dragonfish, Electric Eel, Fangtooth, Goldeye, ...). Fewer than 3
          # means the page is truncated, rate-limited, or the HTML changed.
          if [ "$TRAIN_COUNT" -lt 3 ]; then
            echo "::error title=TrueNAS check::download.truenas.com listing has only ${TRAIN_COUNT} train references — looks broken or rate-limited"
            exit 1
          fi

          MATCHED_TRAINS=$(printf '%s' "$LISTING" | LATEST_VERSION="$LATEST_VERSION" python3 -c "
          import sys, os, re
          version = os.environ['LATEST_VERSION']
          listing = sys.stdin.read()
          pattern = re.compile(r'TrueNAS-SCALE-([A-Z][a-zA-Z]+)/' + re.escape(version) + r'/')
          for t in sorted(set(pattern.findall(listing))):
              print(t)
          ")

          NUM_MATCHES=$(printf '%s' "$MATCHED_TRAINS" | python3 -c "
          import sys
          print(sum(1 for line in sys.stdin if line.strip()))
          ")

          if [ "$NUM_MATCHES" -eq 0 ]; then
            echo "Tag ${LATEST_VERSION} found in scale-build, but not yet listed on download.truenas.com under any train. Will retry on next scheduled run."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$NUM_MATCHES" -gt 1 ]; then
            echo "::error title=TrueNAS check::version ${LATEST_VERSION} appears under multiple trains — refusing to guess"
            echo "Matched trains:" >&2
            printf '%s' "$MATCHED_TRAINS" | sed 's/^/  /' >&2
            exit 1
          fi

          NEW_TRAIN=$(printf '%s' "$MATCHED_TRAINS" | python3 -c "
          import sys
          for line in sys.stdin:
              s = line.strip()
              if s:
                  print(s)
                  break
          ")
          echo "Resolved train for ${LATEST_VERSION}: ${NEW_TRAIN}"

          # ISO-file gate: the directory exists, but the ISO itself may still
          # be uploading. HEAD-check the actual file URL.
          ISO_URL="https://download.truenas.com/TrueNAS-SCALE-${NEW_TRAIN}/${LATEST_VERSION}/TrueNAS-SCALE-${LATEST_VERSION}.iso"
          if ! curl -fsI "$ISO_URL" >/dev/null 2>&1; then
            echo "ISO not yet published at ${ISO_URL}. Will retry on next scheduled run."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$NEW_TRAIN" != "$CURRENT_TRAIN" ]; then
            echo "::notice title=TrueNAS train rollover::train moved from ${CURRENT_TRAIN} to ${NEW_TRAIN} (version ${LATEST_VERSION})"
          fi

          echo "New TrueNAS release detected, train resolved, ISO is published."
          {
            echo "changed=true"
            echo "version=${LATEST_VERSION}"
            echo "train=${NEW_TRAIN}"
          } >> "$GITHUB_OUTPUT"

      # ─────────────────────────────────────────────────────────────────────
      # Kernel coverage gate: the sysext binds to the kernel, not the TrueNAS
      # version string, and point releases usually reuse the previous kernel.
      # Resolve the new version's kernel from its rootfs.mtree manifest (small
      # text fetch, no ISO); if a release for (kernel, current driver) already
      # exists, no build is needed; only a PROMOTED one lets the tracked
      # version advance (see check-kernel-coverage.py). Coverage only counts
      # once the Latest release is kernel-keyed: the one-line installer runs
      # Latest's install.sh, and a pre-migration one matches exact versions
      # only. An unresolvable kernel or Latest falls through to "build", the
      # safe default.
      # ─────────────────────────────────────────────────────────────────────
      - name: Resolve kernel and check coverage
        id: kernel
        if: steps.truenas.outputs.changed == 'true'
        env:
          NEW_VERSION: ${{ steps.truenas.outputs.version }}
          NEW_TRAIN: ${{ steps.truenas.outputs.train }}
          CURRENT_DRIVER: ${{ steps.tracked.outputs.hailo_driver }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          MTREE_URL="https://download.truenas.com/TrueNAS-SCALE-${NEW_TRAIN}/${NEW_VERSION}/rootfs.mtree"
          NEW_KERNEL=$(curl -fsSL "$MTREE_URL" 2>/dev/null \
            | grep -oE 'usr/lib/modules/[0-9][^/ ]*production[^/ ]*' \
            | head -1 | sed 's#usr/lib/modules/##') || true

          if [ -z "$NEW_KERNEL" ]; then
            echo "Kernel for ${NEW_VERSION} not resolvable (no rootfs.mtree yet); building."
            echo "covered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Kernel for ${NEW_VERSION}: ${NEW_KERNEL}"
          export NEW_KERNEL

          # Rollout guard input. A failed lookup leaves LATEST_TAG empty,
          # which the coverage script treats as not kernel-keyed (build).
          LATEST_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null) || LATEST_TAG=""
          echo "Latest release: ${LATEST_TAG:-(lookup failed)}"
          export LATEST_TAG

          # A transient API or parse failure must not fail the daily check:
          # the safe default is covered=false (build it).
          COVERAGE=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | python3 .github/scripts/check-kernel-coverage.py) || COVERAGE=""

          case "$COVERAGE" in
            promoted\ *)
              COVERING_TAG="${COVERAGE#promoted }"
              echo "::notice title=build skipped::${NEW_VERSION} ships kernel ${NEW_KERNEL}, already covered by promoted release ${COVERING_TAG}; the installer serves this version by kernel match. Tracked versions still update."
              echo "covered=true" >> "$GITHUB_OUTPUT"
              ;;
            pending\ *)
              COVERING_TAG="${COVERAGE#pending }"
              echo "::notice title=build skipped::${NEW_VERSION} ships kernel ${NEW_KERNEL}; unpromoted build ${COVERING_TAG} is awaiting hardware-test promotion. No duplicate build is dispatched, and the tracked version does not advance until that release is promoted."
              echo "covered=true" >> "$GITHUB_OUTPUT"
              echo "covered_pending=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "No release the one-line installer can serve covers kernel ${NEW_KERNEL} with driver ${CURRENT_DRIVER}; will build."
              echo "covered=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # ─────────────────────────────────────────────────────────────────────
      # TrueNAS preview (beta) check: TrueNAS 26 betas are not published to
      # scale-build tags or download.truenas.com and ship no GITMANIFEST. They
      # live under a browsable channel (iso.sys.truenas.net/TrueNAS-26-BETA/).
      # Scrape that listing for the highest X.Y[.Z]-BETA.N / -RC.N, gate on the
      # ISO actually being uploaded, and bump truenas_preview.version. The
      # runner is pinned in tracked-versions.json (no GITMANIFEST to resolve
      # from); build.yml downloads the ISO via an iso_url override.
      # ─────────────────────────────────────────────────────────────────────
      - name: Check for new TrueNAS preview release
        id: preview
        env:
          CURRENT_PREVIEW: ${{ steps.tracked.outputs.preview_version }}
          CHANNEL_URL: ${{ steps.tracked.outputs.preview_channel_url }}
        run: |
          set -o pipefail
          echo "Currently tracked preview: ${CURRENT_PREVIEW} (channel ${CHANNEL_URL})"

          if ! LISTING=$(curl -fsSL "$CHANNEL_URL"); then
            echo "Preview channel listing not reachable at ${CHANNEL_URL}. Skipping preview check this run."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Order beta/RC versions: numeric base first (26.0.0), then channel
          # rank (BETA < RC), then the pre-release number. Shared by the
          # "highest in listing" and "is it actually higher" comparisons.
          read -r -d '' PREVIEW_SORT_PY <<'PY' || true
          import sys
          def key(v):
              base, _, pre = v.partition('-')
              bp = [int(x) for x in base.split('.')]
              bp += [0] * (3 - len(bp))
              typ, _, num = pre.partition('.')
              # Same ranking as gen-supported-versions.py's truenas_sort_key:
              # a final release sorts above its BETA/RC.
              rank = 3 if not pre else {'BETA': 0, 'RC': 1}.get(typ.upper(), 2)
              return (bp, rank, int(num) if num.isdigit() else 0)
          vers = [l.strip() for l in sys.stdin if l.strip()]
          if vers:
              print(sorted(vers, key=key)[-1])
          PY

          # Hrefs look like ./26.0.0-BETA.2/?wrap=1 -- extract version dirs.
          # Match the whole ./VERSION/ href segment so a suffix of a longer
          # version (26.0.0.1-BETA.1) cannot be extracted on its own, and
          # allow up to 4 numeric components, the same shape
          # validate-tracked-versions.sh accepts.
          # || true: zero matches exits grep 1, and pipefail + errexit would
          # otherwise kill the whole job here (empty channel after a GA).
          LATEST_PREVIEW=$(printf '%s' "$LISTING" \
            | grep -oE '\./[0-9]+(\.[0-9]+){1,3}-(BETA|RC)\.[0-9]+/' \
            | sed -E 's|^\./([^/]+)/$|\1|' \
            | sort -u \
            | python3 -c "$PREVIEW_SORT_PY") || true

          if [ -z "$LATEST_PREVIEW" ]; then
            echo "No beta/RC versions found in channel listing. Skipping preview check."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Latest preview in channel: ${LATEST_PREVIEW}"

          if [ "$LATEST_PREVIEW" = "$CURRENT_PREVIEW" ]; then
            echo "No new TrueNAS preview release"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only advance forward (guard against listing churn / dir deletion).
          HIGHER=$(printf '%s\n%s\n' "$CURRENT_PREVIEW" "$LATEST_PREVIEW" | python3 -c "$PREVIEW_SORT_PY")
          if [ "$HIGHER" != "$LATEST_PREVIEW" ]; then
            echo "Latest preview ${LATEST_PREVIEW} is not higher than tracked ${CURRENT_PREVIEW} — ignoring"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ISO-file gate: the version dir can exist before the ISO finishes
          # uploading. HEAD-check the actual file URL.
          ISO_URL="${CHANNEL_URL}${LATEST_PREVIEW}/TrueNAS-${LATEST_PREVIEW}.iso"
          if ! curl -fsI "$ISO_URL" >/dev/null 2>&1; then
            echo "Preview ISO not yet published at ${ISO_URL}. Will retry on next scheduled run."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "New TrueNAS preview release detected, ISO is published."
          {
            echo "changed=true"
            echo "version=${LATEST_PREVIEW}"
          } >> "$GITHUB_OUTPUT"

      # ─────────────────────────────────────────────────────────────────────
      # Hailo check: enumerate tags reachable from hailort-drivers' hailo8
      # branch (master tracks 5.x for Hailo-10/15 — does not support Hailo-8),
      # then cap at the HailoRT version Frigate pins on dev.
      # The cap is the gate; HailoRT enforces exact-match between kernel
      # driver and userspace library, and Frigate is the consumer the sysext
      # exists to serve.
      # ─────────────────────────────────────────────────────────────────────
      - name: Check for new HailoRT driver release
        id: hailo
        env:
          CURRENT_DRIVER: ${{ steps.tracked.outputs.hailo_driver }}
        run: |
          set -o pipefail
          echo "Currently tracked HailoRT driver: ${CURRENT_DRIVER}"

          if ! git clone --quiet --filter=blob:none --no-checkout --branch hailo8 \
              https://github.com/hailo-ai/hailort-drivers.git "${RUNNER_TEMP}/hailort-drivers"; then
            echo "::error title=Hailo check::failed to clone hailort-drivers from github.com/hailo-ai/hailort-drivers (hailo8 branch)"
            exit 1
          fi

          # An empty LATEST (no matching tags) is intentionally benign here:
          # CANDIDATE falls through to FRIGATE_PIN, which is the right call
          # when Hailo's tag listing is momentarily unavailable. The `|| true`
          # keeps that behaviour under `set -o pipefail`. The explicit
          # `-z LATEST` branch below is required because `sort -V` orders an
          # empty string *before* any real version string, which would
          # otherwise make CANDIDATE empty and silently skip the bump.
          LATEST=$(git -C "${RUNNER_TEMP}/hailort-drivers" tag --merged origin/hailo8 \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^v//' \
            | sort -V \
            | tail -n1) || true
          echo "Latest available driver tag: ${LATEST}"

          # Parse defensively. Soft failures here are dangerous: if we silently
          # pick the wrong version, the next bump can ship a sysext that breaks
          # users on reboot. Both Frigate pin sources must agree, and the
          # value must be a clean X.Y.Z release. The two sources name the pin
          # differently: the hailo detector plugin (HAILORT_VERSION, the
          # HailoRT Frigate installs at first start) and the Hailo-8L host
          # install script (hailo_version).
          parse_frigate_pin() {
            local url="$1"
            local label="$2"
            local var="$3"
            local content line value count
            if ! content=$(curl -fsSL "$url"); then
              echo "::error title=Frigate pin parser::curl failed fetching ${label} (${url})"
              echo "ERROR: curl failed fetching ${label}: ${url}" >&2
              return 1
            fi
            line=$(printf '%s\n' "$content" \
              | grep -E "^[[:space:]]*(export[[:space:]]+|local[[:space:]]+)?${var}[[:space:]]*=" \
              || true)
            if [ -z "$line" ]; then
              echo "::error title=Frigate pin parser::${label} contains no ${var} assignment"
              echo "ERROR: ${label} contains no ${var} assignment" >&2
              return 1
            fi
            count=$(printf '%s\n' "$line" | wc -l | tr -d ' ')
            if [ "$count" -ne 1 ]; then
              echo "::error title=Frigate pin parser::${label} has ${count} active ${var} assignments (expected 1)"
              echo "ERROR: ${label} has ${count} ${var} assignments (expected 1):" >&2
              printf '%s\n' "$line" >&2
              return 1
            fi
            # The grep above pinned the line to "<var> = <value>", so the
            # value is whatever follows the first "=", unquoted.
            value=$(printf '%s\n' "$line" \
              | sed -E 's/^[^=]*=[[:space:]]*["'"'"']?([^"'"'"' #]+)["'"'"']?.*$/\1/')
            if ! printf '%s' "$value" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error title=Frigate pin parser::${label} ${var} is not a clean X.Y.Z release: '${value}'"
              echo "ERROR: ${label} ${var} is not a clean X.Y.Z release: '${value}'" >&2
              echo "  raw line: ${line}" >&2
              return 1
            fi
            echo "${label}: ${line} -> ${value}" >&2
            printf '%s' "$value"
          }

          # Frigate dropped docker/main/install_hailort.sh when it moved to
          # installing HailoRT at first start; the plugin constant is now the
          # canonical pin.
          if ! FRIGATE_PLUGIN_PIN=$(parse_frigate_pin \
              "https://raw.githubusercontent.com/blakeblackshear/frigate/dev/frigate/detectors/plugins/hailo.py" \
              "frigate dev frigate/detectors/plugins/hailo.py" HAILORT_VERSION); then
            echo "::error title=Frigate pin parser::failed to parse HAILORT_VERSION from frigate/detectors/plugins/hailo.py; refusing to bump"
            exit 1
          fi
          if ! FRIGATE_HAILO8L_PIN=$(parse_frigate_pin \
              "https://raw.githubusercontent.com/blakeblackshear/frigate/dev/docker/hailo8l/user_installation.sh" \
              "frigate dev docker/hailo8l/user_installation.sh" hailo_version); then
            echo "::error title=Frigate pin parser::failed to parse hailo_version from docker/hailo8l/user_installation.sh; refusing to bump"
            exit 1
          fi

          if [ "$FRIGATE_PLUGIN_PIN" != "$FRIGATE_HAILO8L_PIN" ]; then
            echo "::error title=Frigate pins disagree::hailo.py HAILORT_VERSION=${FRIGATE_PLUGIN_PIN}, user_installation.sh hailo_version=${FRIGATE_HAILO8L_PIN}; refusing to guess which is canonical"
            exit 1
          fi
          FRIGATE_PIN="$FRIGATE_PLUGIN_PIN"
          echo "Frigate pinned version: ${FRIGATE_PIN}"

          if [ -z "$LATEST" ]; then
            CANDIDATE="$FRIGATE_PIN"
          else
            CANDIDATE=$(printf '%s\n%s\n' "$LATEST" "$FRIGATE_PIN" | sort -V | head -n1)
          fi
          echo "Capped candidate version: ${CANDIDATE}"

          # Surface when the cap is actively suppressing a newer Hailo release.
          # Useful for noticing when Frigate is the bottleneck without trawling
          # scheduled-run logs. Only fires when LATEST is parseable (otherwise
          # the cap-vs-no-cap signal is noise).
          if [ -n "$LATEST" ]; then
            HIGHEST=$(printf '%s\n%s\n' "$LATEST" "$FRIGATE_PIN" | sort -V | tail -n1)
            if [ "$HIGHEST" = "$LATEST" ] && [ "$LATEST" != "$FRIGATE_PIN" ]; then
              echo "::notice title=Frigate cap active::HailoRT ${LATEST} available but capped at Frigate's pinned ${FRIGATE_PIN}"
            fi
          fi

          if [ -n "$CANDIDATE" ] && [ "$CANDIDATE" != "$CURRENT_DRIVER" ]; then
            HIGHER=$(printf '%s\n%s\n' "$CURRENT_DRIVER" "$CANDIDATE" | sort -V | tail -n1)
            if [ "$HIGHER" = "$CANDIDATE" ]; then
              echo "Newer driver version found: ${CANDIDATE} (Hailo latest: ${LATEST}, Frigate pin: ${FRIGATE_PIN})"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "driver=${CANDIDATE}" >> "$GITHUB_OUTPUT"
            else
              echo "No newer driver (tracked is ahead of Frigate pin — wait for Frigate to move)"
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No newer driver (Hailo latest: ${LATEST}, Frigate pin: ${FRIGATE_PIN})"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # ─────────────────────────────────────────────────────────────────────
      # If anything moved, resolve the runner from the post-bump train+version
      # (TrueNAS bump may have rolled the train; Hailo-only bump uses current).
      # The runner's GLIBC must be ≤ the TrueNAS rootfs's; resolve-runner.sh
      # fails loud on an unmapped Debian release — that's the explicit signal.
      # ─────────────────────────────────────────────────────────────────────
      - name: Resolve build runner
        id: runner
        if: >-
          (steps.truenas.outputs.changed == 'true' && steps.kernel.outputs.covered != 'true') ||
          steps.hailo.outputs.changed == 'true'
        env:
          # Same composite as TRUENAS_CHANGED: under covered_pending the
          # dispatch builds the tracked version, so resolve its runner.
          TRUENAS_EFFECTIVE: ${{ steps.truenas.outputs.changed == 'true' && steps.kernel.outputs.covered_pending != 'true' }}
        run: |
          if [ "$TRUENAS_EFFECTIVE" = "true" ]; then
            TRAIN="${{ steps.truenas.outputs.train }}"
            VERSION="${{ steps.truenas.outputs.version }}"
          else
            TRAIN="${{ steps.tracked.outputs.train }}"
            VERSION="${{ steps.tracked.outputs.truenas_version }}"
          fi
          RUNNER=$(.github/scripts/resolve-runner.sh "$TRAIN" "$VERSION")
          echo "runner=${RUNNER}" >> "$GITHUB_OUTPUT"

      # ─────────────────────────────────────────────────────────────────────
      # Single commit covering whichever fields actually moved. The state
      # file is rewritten in place; build.yml reads it at runtime so no
      # workflow file changes are needed. Commit message reflects the
      # combination so `git log` is self-explanatory.
      # ─────────────────────────────────────────────────────────────────────
      # covered_pending holds the stable version back (see the coverage step);
      # the composite TRUENAS_CHANGED keeps write, message, and condition agreed.
      - name: Update tracked-versions
        id: write
        if: >-
          (steps.truenas.outputs.changed == 'true' && steps.kernel.outputs.covered_pending != 'true') ||
          steps.preview.outputs.changed == 'true' ||
          steps.hailo.outputs.changed == 'true'
        env:
          TRUENAS_CHANGED: ${{ steps.truenas.outputs.changed == 'true' && steps.kernel.outputs.covered_pending != 'true' }}
          NEW_TRUENAS_VERSION: ${{ steps.truenas.outputs.version }}
          NEW_TRAIN: ${{ steps.truenas.outputs.train }}
          PREVIEW_CHANGED: ${{ steps.preview.outputs.changed }}
          NEW_PREVIEW_VERSION: ${{ steps.preview.outputs.version }}
          HAILO_CHANGED: ${{ steps.hailo.outputs.changed }}
          NEW_HAILO_DRIVER: ${{ steps.hailo.outputs.driver }}
          CURRENT_TRAIN: ${{ steps.tracked.outputs.train }}
        run: |
          set -euo pipefail

          # firmware_sha256 is no longer carried in tracked-versions.json —
          # build.yml computes it per-release and uploads firmware.sha256 as
          # a release asset (see #24). check-releases only updates the
          # driver version here; the build pipeline owns the sha.
          python3 - <<'PY'
          import json, os
          with open('.github/tracked-versions.json') as f:
              s = json.load(f)
          if os.environ['TRUENAS_CHANGED'] == 'true':
              s['truenas']['version'] = os.environ['NEW_TRUENAS_VERSION']
              s['truenas']['train']   = os.environ['NEW_TRAIN']
          if os.environ['PREVIEW_CHANGED'] == 'true':
              s['truenas_preview']['version'] = os.environ['NEW_PREVIEW_VERSION']
          if os.environ['HAILO_CHANGED'] == 'true':
              s['hailo']['driver']    = os.environ['NEW_HAILO_DRIVER']
          with open('.github/tracked-versions.json', 'w') as f:
              json.dump(s, f, indent=2)
              f.write('\n')
          PY

          # Determine the post-update values for the dispatch.
          if [ "$TRUENAS_CHANGED" = "true" ]; then
            FINAL_TRUENAS_VERSION="$NEW_TRUENAS_VERSION"
            FINAL_TRAIN="$NEW_TRAIN"
          else
            FINAL_TRUENAS_VERSION="${{ steps.tracked.outputs.truenas_version }}"
            FINAL_TRAIN="$CURRENT_TRAIN"
          fi
          if [ "$HAILO_CHANGED" = "true" ]; then
            FINAL_HAILO_DRIVER="$NEW_HAILO_DRIVER"
          else
            FINAL_HAILO_DRIVER="${{ steps.tracked.outputs.hailo_driver }}"
          fi

          # Compose a commit message that names whatever moved.
          PARTS=()
          if [ "$TRUENAS_CHANGED" = "true" ]; then
            if [ "$NEW_TRAIN" != "$CURRENT_TRAIN" ]; then
              PARTS+=("TrueNAS ${NEW_TRUENAS_VERSION} (train: ${NEW_TRAIN})")
            else
              PARTS+=("TrueNAS ${NEW_TRUENAS_VERSION}")
            fi
          fi
          if [ "$PREVIEW_CHANGED" = "true" ]; then
            PARTS+=("TrueNAS preview ${NEW_PREVIEW_VERSION}")
          fi
          if [ "$HAILO_CHANGED" = "true" ]; then
            PARTS+=("HailoRT ${NEW_HAILO_DRIVER}")
          fi
          JOINED=$(printf '%s, ' "${PARTS[@]}")
          MSG="Update tracked versions: ${JOINED%, }"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/tracked-versions.json
          git commit -m "$MSG" || {
            echo "ERROR: Failed to commit tracked-versions update"
            exit 1
          }
          # Retry once on push failure: if main moved (e.g. Dependabot merge)
          # between checkout and now, rebase on top and try again.
          if ! git push; then
            echo "Push failed, attempting rebase and retry..."
            git pull --rebase || {
              echo "::error title=Push failed::git pull --rebase failed after push rejection"
              exit 1
            }
            git push || {
              echo "::error title=Push failed::git push failed after rebase retry"
              exit 1
            }
          fi

          {
            echo "truenas_version=${FINAL_TRUENAS_VERSION}"
            echo "train=${FINAL_TRAIN}"
            echo "hailo_driver=${FINAL_HAILO_DRIVER}"
          } >> "$GITHUB_OUTPUT"

          # Preview dispatch values (post-write). The ISO URL is derived from
          # channel_url + version so the dispatch can hand build.yml a
          # ready-to-use iso_url override.
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open('.github/tracked-versions.json') as f:
              s = json.load(f)
          pv = s['truenas_preview']
          ver = pv['version']
          print(f"preview_version={ver}")
          print(f"preview_train={pv['train']}")
          print(f"preview_runner={pv['runner']}")
          print(f"preview_iso_url={pv['channel_url']}{ver}/TrueNAS-{ver}.iso")
          PY

      # ─────────────────────────────────────────────────────────────────────
      # Dispatch build.yml. Two independent targets share the current driver:
      #   - stable: built when TrueNAS stable or the HailoRT driver moved.
      #   - preview: built when the TrueNAS beta or the driver moved.
      # So a driver bump produces BOTH a 25.x and a 26-beta build ("each
      # release has both"); a TrueNAS-only bump on one channel builds only that
      # channel. mark_latest='false' on both keeps unverified auto-builds out of
      # /releases/latest; preview builds additionally never promote (build.yml
      # gives them the preview-hardware-test label and promote.yml refuses
      # beta/RC tags).
      # ─────────────────────────────────────────────────────────────────────
      - name: Trigger stable build
        if: >-
          (steps.truenas.outputs.changed == 'true' && steps.kernel.outputs.covered != 'true') ||
          steps.hailo.outputs.changed == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              ref: 'main',
              inputs: {
                truenas_version:      '${{ steps.write.outputs.truenas_version }}',
                hailo_driver_version: '${{ steps.write.outputs.hailo_driver }}',
                train_name:           '${{ steps.write.outputs.train }}',
                runner:               '${{ steps.runner.outputs.runner }}',
                mark_latest:          'false'
              }
            });
            console.log('Dispatched stable build.yml: TrueNAS ${{ steps.write.outputs.truenas_version }} (${{ steps.write.outputs.train }}), HailoRT ${{ steps.write.outputs.hailo_driver }}, runner ${{ steps.runner.outputs.runner }}');

      - name: Trigger preview build
        if: steps.preview.outputs.changed == 'true' || steps.hailo.outputs.changed == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              ref: 'main',
              inputs: {
                truenas_version:      '${{ steps.write.outputs.preview_version }}',
                hailo_driver_version: '${{ steps.write.outputs.hailo_driver }}',
                train_name:           '${{ steps.write.outputs.preview_train }}',
                runner:               '${{ steps.write.outputs.preview_runner }}',
                iso_url:              '${{ steps.write.outputs.preview_iso_url }}',
                mark_latest:          'false'
              }
            });
            console.log('Dispatched preview build.yml: TrueNAS ${{ steps.write.outputs.preview_version }} (${{ steps.write.outputs.preview_train }}), HailoRT ${{ steps.write.outputs.hailo_driver }}, runner ${{ steps.write.outputs.preview_runner }}, iso_url ${{ steps.write.outputs.preview_iso_url }}');
