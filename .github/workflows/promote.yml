name: Promote release on hardware-test sign-off

# A hardware test on a TrueNAS train approves a build for that train's boxes
# only. build.yml opens one issue per build: `hardware-test` for a stable
# build, `preview-hardware-test` for a TrueNAS preview (beta/RC) one, each
# with a `<!-- release-tag: X -->` marker, so this is independent of
# issue-title formatting. The train is the one the build was made for, read
# from the "for TrueNAS SCALE <version>" header build.yml writes into the
# release notes: the major version from 26 on (every 26.x release, betas
# included, is train 26), major.minor before that (25.10). When an issue is
# closed as completed:
#   - `<!-- verified-train: KEY -->` is appended to the release notes, once.
#     get.sh and install.sh install a build on a train only when its notes
#     carry that train's marker, or when it is a full release with no marker
#     at all (promoted before per-train sign-off, grandfathered);
#   - a stable build is also promoted, as before: flipped from prerelease to
#     a full release, a changelog appended (GitHub's PR-based auto-notes + a
#     commit list, since most changes here land as direct pushes that
#     PR-notes miss), and marked Latest when it outranks the current Latest
#     (cmpRank below). Marker, flip and changelog go in ONE update: a full
#     release without the marker would count as approved for every train,
#     even for a moment;
#   - a preview build only gets the marker. It stays a prerelease forever and
#     is never promoted to Latest.
# Closed as "not planned": no change.
#
# Editing a release does not touch the protected branch, so the default
# GITHUB_TOKEN (contents: write) is sufficient; no app token needed.

on:
  issues:
    types: [closed]

permissions:
  contents: write
  issues: write

jobs:
  promote:
    # Only hardware-test issues closed as "completed" (not "not planned").
    if: >-
      (contains(github.event.issue.labels.*.name, 'hardware-test') ||
       contains(github.event.issue.labels.*.name, 'preview-hardware-test')) &&
      github.event.issue.state_reason == 'completed'
    runs-on: ubuntu-latest
    steps:
      - name: Record the sign-off on the release this issue gates
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const { owner, repo } = context.repo;

            // BEGIN promote-ranking
            // Canonical preview rule (keep in sync with install.sh's
            // preview_release and gen-supported-versions.py's is_preview):
            // preview iff the string contains -BETA or -RC as a substring,
            // case-insensitive. No \b anchor: a dotless 26.0.0-RC1 must still
            // classify as preview, matching the installer.
            const previewVer = (s) => /-(?:BETA|RC)/i.test(s || '');
            // Fallback for a release whose tag lost its version: the notes
            // header build.yml always renders ("for TrueNAS SCALE <version>")
            // names the target.
            const bodyVerOf = (r) => (((r.body || '').match(/for TrueNAS SCALE (\S+)/) || [])[1] || '');
            const previewRelease = (r) => previewVer(r.tag_name) || previewVer(bodyVerOf(r));

            // Releases rank by the kernel they target: k-tags encode it
            // directly, v-tag releases record it in their Target kernel body
            // row. A release with an unknown kernel (legacy body) ranks below
            // any known kernel. Two releases on the SAME kernel (a driver
            // bump rebuilds every kernel, leaving two per kernel) rank by
            // TrueNAS version when both tags carry one, then by run number
            // (which also orders k-tags, which carry no version). The run
            // number alone cannot come first: an older version rebuilt later
            // has a HIGHER run than the Latest it must not displace. This
            // keeps the invariant across the tag-scheme migration: promoting
            // an older build never regresses Latest, whatever scheme the
            // newer build uses. A k-tag measured against a version-only rank
            // shares no dimension at all; publication date decides there.
            const numOf = (s) => {
              const m = (s || '').match(/^(\d+(?:\.\d+)*)/);
              return m ? m[1].split('.').map(Number) : null;
            };
            const rankOf = (r) => {
              const t = r.tag_name || '';
              let kernel = null;
              const km = t.match(/^k(\d+(?:\.\d+)*)-/);
              if (km) kernel = km[1].split('.').map(Number);
              if (!kernel) kernel = numOf(((r.body || '').match(/Target kernel\s*\|\s*`([^`]+)`/) || [])[1]);
              const vm = t.match(/^v(\d+(?:\.\d+)*)-/);
              const ver = vm ? vm[1].split('.').map(Number) : null;
              const rm = t.match(/-r(\d+)$/);
              const run = rm ? Number(rm[1]) : 0;
              const date = Date.parse(r.published_at || r.created_at || '') || 0;
              return (kernel || ver) ? { kernel, ver, run, date } : null;
            };
            const cmpNum = (a, b) => {
              const n = Math.max(a.length, b.length);
              for (let i = 0; i < n; i++) { const d = (a[i] || 0) - (b[i] || 0); if (d) return d; }
              return 0;
            };
            const cmpRank = (a, b) => {
              if (a.kernel && b.kernel) {
                const dk = cmpNum(a.kernel, b.kernel);
                if (dk) return dk;
                if (a.ver && b.ver) {
                  const dv = cmpNum(a.ver, b.ver);
                  if (dv) return dv;
                }
                return a.run - b.run;
              }
              if (a.kernel || b.kernel) {
                // kernel-only vs version-only shares no dimension: date
                // decides (see comment above); otherwise known kernel wins.
                if (!(a.ver && b.ver)) {
                  const dd = a.date - b.date;
                  if (dd) return dd;
                }
                return a.kernel ? 1 : -1;
              }
              return cmpNum(a.ver || [], b.ver || []) || (a.run - b.run);
            };
            const decideMakeLatest = (rel, others) => {
              const thisVer = rankOf(rel);
              let newest = thisVer;  // rel is becoming non-prerelease
              for (const r of others) {
                // Betas / unverified builds can't be Latest. The prerelease
                // flag alone is not trusted here: a beta mispublished as a
                // full release would outrank every stable version and wedge
                // makeLatest=false for all later stable promotions.
                if (r.prerelease || previewRelease(r)) continue;
                const v = rankOf(r);
                if (v && (!newest || cmpRank(v, newest) > 0)) newest = v;
              }
              const makeLatest = (thisVer && newest && cmpRank(thisVer, newest) >= 0) ? 'true' : 'false';
              return { makeLatest, newest };
            };
            // Train key of a TrueNAS version, '' when it has none. Same rule
            // as get.sh/install.sh's truenas_train_key and train_key: the
            // major version from 26 on (26.0.0-BETA.3 and 26.1.2 are both
            // 26), major.minor before that (25.10.7 is 25.10).
            const trainKey = (v) => {
              const s = v || '';
              const dot = s.indexOf('.');
              const major = dot < 0 ? s : s.slice(0, dot);
              if (!/^\d+$/.test(major)) return '';
              if (Number(major) >= 26) return major;
              if (dot < 0) return '';
              const minor = s.slice(dot + 1).match(/^\d*/)[0];
              return minor ? `${major}.${minor}` : '';
            };
            // Trains a release is approved for: one verified-train line each
            // (the installer's pattern: the marker starts a line).
            const verifiedTrains = (r) => new Set(
              [...(r.body || '').matchAll(/^[ \t]*<!--\s*verified-train:\s*([^\s>]+?)\s*-->/gm)].map((m) => m[1]));
            // END promote-ranking

            const m = (issue.body || '').match(/<!--\s*release-tag:\s*(\S+?)\s*-->/);
            if (!m) {
              core.info('No <!-- release-tag --> marker in issue body; nothing to promote.');
              return;
            }
            const tag = m[1];
            const labels = (issue.labels || []).map((l) => (typeof l === 'string' ? l : l.name));
            const comment = (body) => github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });

            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (e) {
              if (e.status === 404) {
                await comment(`No release found for tag \`${tag}\`; nothing to promote.`);
                return;
              }
              throw e;
            }
            const link = `[\`${tag}\`](${release.html_url})`;

            // The train the build was made for, from its notes header. k-tags
            // carry no TrueNAS version, so the header is the one place every
            // build names it.
            const bodyVer = bodyVerOf(release);
            const train = trainKey(bodyVer);
            if (!train) {
              await comment(`The release notes of ${link} name no TrueNAS version ("for TrueNAS SCALE <version>"), so the train this sign-off approves it for is unknown. No change was made.`);
              core.info(`No train for ${tag}; no change.`);
              return;
            }

            // A TrueNAS preview (beta/RC) build is never promoted: that would
            // put a beta build on Latest. The label says so, and so does the
            // tag (v-tags), the preview-build marker build.yml writes next to
            // release-tag (k-tags carry no BETA marker), or the notes header.
            // Any one of them keeps the release a prerelease; the sign-off
            // then only adds the train's marker.
            const pm = (issue.body || '').match(/<!--\s*preview-build:\s*(\S+?)\s*-->/);
            const preview = labels.includes('preview-hardware-test') || previewVer(tag) ||
              Boolean(pm && pm[1] === 'true') || previewVer(bodyVer);

            const approvedTrains = verifiedTrains(release);
            if (approvedTrains.has(train)) {
              await comment(`${link} is already approved for TrueNAS train \`${train}\`. No change.`);
              return;
            }
            // A full release with no marker is already approved for every
            // train. A marker would narrow that to this train alone.
            if (!release.prerelease && approvedTrains.size === 0 && !preview) {
              await comment(`Release ${link} is already promoted (a full release from before per-train sign-off, approved for every train). No change.`);
              return;
            }

            const marker = `\n\n<!-- verified-train: ${train} -->\n`;
            const approvedNote = `approved it for TrueNAS train \`${train}\`, so \`get.sh\` installs it on train ${train} boxes running its kernel`;

            // make_latest is explicit on the marker-only updates: GitHub's
            // update endpoint defaults it to true when left out.
            if (preview) {
              await github.rest.repos.updateRelease({ owner, repo, release_id: release.id,
                make_latest: 'false', body: (release.body || '') + marker });
              await comment(`Verified: ${approvedNote}. It is a TrueNAS preview (${bodyVer || tag}) build, so it stays a pre-release and is never promoted to Latest.`);
              core.info(`Approved preview build ${tag} for train ${train} (marker only).`);
              return;
            }

            if (!release.prerelease) {
              // Already promoted and approved for other trains: add this one.
              await github.rest.repos.updateRelease({ owner, repo, release_id: release.id,
                make_latest: 'false', body: (release.body || '') + marker });
              await comment(`Verified: ${approvedNote}.`);
              core.info(`Approved ${tag} for train ${train} (already a full release).`);
              return;
            }

            // Previous release (by created_at) bounds the changelog range.
            // Anchor only to promoted stable releases: an interleaved BETA
            // tag or unpromoted prerelease would bound the range at the wrong
            // release and publish an empty or wrong commit list.
            const rels = (await github.rest.repos.listReleases({ owner, repo, per_page: 100 })).data
              .filter(r => r.id !== release.id && !r.draft)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const prev = rels.find(r => !r.prerelease && !previewRelease(r) &&
              new Date(r.created_at) <= new Date(release.created_at));

            // GitHub's PR-based auto-notes.
            let prNotes = '';
            try {
              const gen = await github.rest.repos.generateReleaseNotes({ owner, repo, tag_name: tag,
                ...(prev ? { previous_tag_name: prev.tag_name } : {}) });
              prNotes = (gen.data.body || '').trim();
            } catch (e) { core.warning(`generate-notes failed: ${e.message}`); }

            // Commit list: captures the direct/app pushes PR-notes don't.
            let commits = '';
            if (prev) {
              try {
                const cmp = await github.rest.repos.compareCommitsWithBasehead({ owner, repo,
                  basehead: `${prev.tag_name}...${tag}` });
                commits = (cmp.data.commits || [])
                  .map(c => `- ${c.commit.message.split('\n')[0]} (\`${c.sha.slice(0, 7)}\`)`)
                  .join('\n');
              } catch (e) { core.warning(`compare failed: ${e.message}`); }
            }

            let changelog = '\n\n## Changelog\n';
            if (prNotes) changelog += `\n${prNotes}\n`;
            if (commits) changelog += `\n### Commits\n${commits}\n`;
            if (!prNotes && !commits) changelog += '\n_Initial release._\n';

            // Newest-stable decision: rationale sits with decideMakeLatest
            // above. rels = all other non-draft releases.
            const { makeLatest, newest } = decideMakeLatest(release, rels);

            // Flip, changelog and marker in one update (see the top of file).
            await github.rest.repos.updateRelease({ owner, repo, release_id: release.id,
              prerelease: false, make_latest: makeLatest,
              body: (release.body || '') + changelog + marker });

            const latestNote = makeLatest === 'true'
              ? 'and set it as the latest release'
              : `as a full release (Latest stays on the newer \`${newest ? (newest.kernel ? 'kernel ' + newest.kernel.join('.') : newest.ver.join('.')) : ''}\`)`;
            await comment(`Verified: promoted ${link} ${latestNote}, appended the changelog, and ${approvedNote}.`);
            core.info(`Promoted ${tag} (make_latest=${makeLatest}) and approved it for train ${train}.`);
